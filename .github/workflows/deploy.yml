name: Production Deployment & Container Release

# Runs only after CI has finished for a push to main, never alongside it.
# verify-ci then refuses to continue unless that CI run succeeded; a manual
# dispatch must name a commit that already has a successful CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

defaults:
  run:
    working-directory: laravel

jobs:
  # ── 1. Require CI Pass Prior to Deployment ──────────────────────────
  verify-ci:
    name: Verify CI Gate Passed
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # workflow_run: the triggering CI run must be a successful push to
      # main in this repository. The branch filter alone also matches a
      # pull request from a fork's own `main`, so the event and repository
      # are checked too.
      - name: Require the triggering CI run to have passed
        if: github.event_name == 'workflow_run'
        id: from-run
        working-directory: .
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "CI run for $HEAD_SHA: event=$EVENT repo=$HEAD_REPO conclusion=$CONCLUSION"
          if [ "$CONCLUSION" != "success" ] || [ "$EVENT" != "push" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::CI did not pass for a push to main in this repository. Not deploying."
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # workflow_dispatch: look up CI for the commit being deployed.
      - name: Require a successful CI run for the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        id: from-dispatch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run exists for $GITHUB_SHA. Push it and let CI pass first."
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Record the commit cleared for deployment
        id: gate
        working-directory: .
        run: echo "sha=${{ steps.from-run.outputs.sha || steps.from-dispatch.outputs.sha }}" >> "$GITHUB_OUTPUT"

  # ── 2. Build & Verify Production Container ──────────────────────────
  build-and-verify:
    name: Build & Verify Production Stack
    runs-on: ubuntu-latest
    needs: [verify-ci]
    steps:
      # Check out the commit CI passed, not the branch tip, which may have
      # moved on since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: laravel
          file: laravel/Dockerfile
          load: true
          tags: community-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Container Test Environment
        run: |
          cp .env.production.example .env.production
          # Inject generated secrets for runtime validation
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:7K5M8vX9L2pQ1wR4tY7uI0oP3sA6dF9gH2jK5lZ8xCc=|' .env.production
          sed -i 's|^GATE_ENGINE_SECRET=.*|GATE_ENGINE_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|' .env.production
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=secret_db_pass_2026|' .env.production
          sed -i 's|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=secret_root_pass_2026|' .env.production

      - name: Start Production Stack via Docker Compose
        run: |
          docker compose --env-file .env.production up -d --build

      - name: Wait for Stack Healthcheck
        run: |
          echo "Waiting for services to become healthy..."
          timeout 90s bash -c '
            until docker compose ps | grep -E "app.*healthy"; do
              echo "Waiting for web container health check..."
              sleep 5
            done
          '

      # Laravel's /up answers 200 when the app boots and 500 when it does not;
      # its body is an HTML page, so check the status code rather than text.
      - name: Verify Web Endpoint Health
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:8080/up) || true
          echo "GET /up -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $status, expected 200."
            exit 1
          fi

      - name: Verify Queue Worker Container
        run: |
          # Verify queue worker container is running
          docker compose ps queue | grep -E "Up|running"
          docker compose exec -T queue php artisan queue:failed

      - name: Verify Scheduler Container
        run: |
          # Verify scheduler container is running
          docker compose ps scheduler | grep -E "Up|running"
          docker compose exec -T scheduler php artisan schedule:list

      - name: Dump Container Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Graceful Container Shutdown
        if: always()
        run: |
          docker compose down -v

  # ── 3. Deployment Notification & Final Gate ─────────────────────────
  deployment-status:
    name: Deployment Gate (PASS / FAIL)
    runs-on: ubuntu-latest
    needs: [build-and-verify]
    if: always()
    steps:
      - name: Output deployment verdict
        run: |
          if [ "${{ needs.build-and-verify.result }}" = "success" ]; then
            echo "=========================================================="
            echo "  DEPLOYMENT VALIDATION SUCCEEDED: ALL SERVICES HEALTHY   "
            echo "=========================================================="
            echo "Web container, queue worker, and scheduler verified."
          else
            echo "=========================================================="
            echo "  DEPLOYMENT VALIDATION FAILED: CHECK CONTAINER LOGS      "
            echo "=========================================================="
            exit 1
          fi
